AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  KindredMemory — ingest, recall, and chat Lambda functions, behind API
  Gateway HTTP API routes. Local build/verify only; nothing here creates
  real AWS resources until `sam deploy` is run by hand.

# DATABASE_URL and GEMINI_API_KEY are template parameters, not hardcoded
# values, and NoEcho keeps them out of CloudFormation console/CLI output.
# Real values are supplied at deploy time via
# `sam deploy --parameter-overrides DatabaseUrl=... GeminiApiKey=...` or a
# `samconfig.toml` — which must never be committed (see .gitignore) since
# `sam deploy --guided` will happily write real parameter values into it.
Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: CockroachDB Cloud connection string (see .env.example for the shape).
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Gemini API key, from https://aistudio.google.com/apikey.

Globals:
  Function:
    # nodejs20.x (named in earlier task instructions) is being phased out —
    # AWS blocks *new* function creation on it starting 2026-08-31, so this
    # uses nodejs22.x instead (current LTS, supported through 2027-04-30;
    # confirmed against AWS's Lambda runtime support docs during this pass).
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    # Both handlers do a Gemini embedding call plus a CockroachDB round
    # trip; 3s (Lambda's default) isn't enough headroom, especially on a
    # cold start. 15s covers a slow embedding call + DB round trip
    # comfortably without masking a genuinely hung request for too long.
    Timeout: 15
    MemorySize: 512
    Environment:
      Variables:
        DATABASE_URL: !Ref DatabaseUrl
        GEMINI_API_KEY: !Ref GeminiApiKey

Resources:
  # Explicit HTTP API, replacing the implicit one SAM previously created on
  # its own from the three functions' HttpApi events (which had no CORS
  # config at all). A browser-based frontend will call /memory, /recall,
  # and /chat directly from JS on a different origin than wherever the API
  # ends up — without CORS, browsers block that even though the API itself
  # works fine over curl. CorsConfiguration syntax confirmed against
  # current SAM docs during this pass (AWS::Serverless::HttpApi's
  # CorsConfiguration property, type HttpApiCorsConfiguration).
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # AllowOrigins: "*" is a known simplification, not a silent
        # choice — this is a hackathon demo and the frontend doesn't exist
        # yet, so there's no real domain to scope this to. A real
        # production deployment should replace "*" with the frontend's
        # actual origin once it exists.
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  AddMemoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Pre-built by `npm run build:lambda` (esbuild + a curated
      # node_modules — see scripts/build-lambda.mjs for why). Run that
      # before `sam build`; this CodeUri intentionally does NOT use SAM's
      # own Metadata.BuildMethod: esbuild integration.
      CodeUri: dist-lambda/addMemoryHandler/
      Handler: index.handler
      Events:
        AddMemory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /memory
            Method: POST

  RecallFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambda/recallHandler/
      Handler: index.handler
      Events:
        Recall:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /recall
            Method: POST

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambda/chatHandler/
      Timeout: 30
      Handler: index.handler
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /chat
            Method: POST
        # Keeps ChatFunction's execution environment warm so a real user
        # doesn't eat a cold start (a genuine request once hit the full 30s
        # timeout cold, then succeeded in 5s warm on retry). This costs
        # nothing beyond the free Lambda invocation tier — 12 invocations/
        # hour is far inside the always-free 1M/month allowance, and
        # chatHandler.ts's isApiGatewayHttpEvent() check makes this ping
        # short-circuit before touching Gemini or CockroachDB, so it can
        # never generate a real Gemini API call no matter how often it
        # fires. Input is the entire event payload the function receives
        # for this trigger (SAM/EventBridge replaces the event text
        # wholesale when Input is set) — see chatHandler.ts for why that
        # makes this marker unspoofable by a real request.
        # TODO: disable or delete this Schedule block once the hackathon
        # submission window closes (2026-08-18) — there's no reason to keep
        # a function warm for judges who are no longer looking at it.
        WarmupPing:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: kindred-memory-chat-warmup
            Description: >-
              Pings ChatFunction every 5 minutes to avoid cold starts for
              real users. Short-circuits before any Gemini/DB call — see
              isApiGatewayHttpEvent() in chatHandler.ts. Remove after the
              hackathon judging period ends.
            Enabled: true
            Input: '{"warmupPing": true}'

  ListConversationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambda/listConversationsHandler/
      Handler: index.handler
      Events:
        ListConversations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /conversations
            Method: GET

  ConversationTranscriptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambda/conversationTranscriptHandler/
      Handler: index.handler
      Events:
        ConversationTranscript:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /conversations/transcript
            Method: GET

  ListMemoriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambda/listMemoriesHandler/
      Handler: index.handler
      Events:
        ListMemories:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /memories
            Method: GET

  ListFamilyMembersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambda/listFamilyMembersHandler/
      Handler: index.handler
      Events:
        ListFamilyMembers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /family-members
            Method: GET

Outputs:
  ApiEndpoint:
    Description: Base URL of the HTTP API (explicit HttpApi resource above — shared by all three routes).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
